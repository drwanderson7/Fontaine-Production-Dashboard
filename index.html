<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Production Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React 17 UMD - avoids import/module conflicts when opened from file:// -->
    <script src="https://unpkg.com/react@17.0.2/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@17.0.2/umd/react-dom.production.min.js"></script>

    <!-- Prop-types + react-is (matched to React 17) -->
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    <script src="https://unpkg.com/react-is@17.0.2/umd/react-is.production.min.js"></script>

    <!-- Babel standalone JSX transformer (pinned version) -->
    <script src="https://unpkg.com/@babel/standalone@7.23.2/babel.min.js"></script>

    <!-- Recharts UMD (compatible with React 17 + Babel standalone) -->
    <script src="https://unpkg.com/recharts@2.8.0/umd/Recharts.js"></script>

    <!-- SheetJS for Excel/CSV parsing (pinned, stable) -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>

    <!-- Phosphor Icons (CSS icon font, no module needed) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css">

    <!-- Preloaded Data Container: This holds the baked-in data after exporting -->
    <script id="preloaded-data" type="application/json">null</script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen font-sans">
    
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;
        const { BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, ReferenceLine, LabelList, Legend, Cell } = Recharts;

        const UploadCloud = ({ className }) => <i className={`ph ph-cloud-arrow-up ${className}`}></i>;
        const FileSpreadsheet = ({ className }) => <i className={`ph ph-file-csv ${className}`}></i>;
        const Trophy = ({ className }) => <i className={`ph ph-trophy ${className}`}></i>;
        const Calendar = ({ className }) => <i className={`ph ph-calendar-blank ${className}`}></i>;
        const TrendingUp = ({ className }) => <i className={`ph ph-trend-up ${className}`}></i>;
        const AlertCircle = ({ className }) => <i className={`ph ph-warning-circle ${className}`}></i>;
        const Printer = ({ className }) => <i className={`ph ph-printer ${className}`}></i>;
        const Download = ({ className }) => <i className={`ph ph-download-simple ${className}`}></i>;

        // Robust CSV Parser
        function parseCSV(str) {
            const result = [];
            let row = [];
            let inQuotes = false;
            let val = '';
            for (let i = 0; i < str.length; i++) {
                const char = str[i];
                if (char === '"') {
                    if (inQuotes && str[i + 1] === '"') {
                        val += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (char === ',' && !inQuotes) {
                    row.push(val.trim());
                    val = '';
                } else if ((char === '\n' || char === '\r') && !inQuotes) {
                    if (char === '\r' && str[i + 1] === '\n') i++;
                    row.push(val.trim());
                    result.push(row);
                    row = [];
                    val = '';
                } else {
                    val += char;
                }
            }
            if (val || row.length > 0) {
                row.push(val.trim());
                result.push(row);
            }
            return result;
        }

        function processData(csvText) {
            const parsed = parseCSV(csvText);
            let headerRowIdx = -1;
            
            for (let i = 0; i < parsed.length && i < 20; i++) {
                const rowStr = parsed[i].join(',').toLowerCase();
                if (rowStr.includes('date completed') && rowStr.includes('build line')) {
                headerRowIdx = i;
                break;
                }
            }
            
            if (headerRowIdx === -1) throw new Error("Could not find required headers ('Date Completed', 'Build Line') in CSV.");

            const headers = parsed[headerRowIdx].map(h => h.trim().toLowerCase());
            const dateIdx    = headers.findIndex(h => h.includes('date completed'));
            const weekIdx    = headers.findIndex(h => h === 'week completed' || h === 'week #');
            const lineIdx    = headers.findIndex(h => h.includes('build line'));
            const otdIdx     = headers.findIndex(h => h === 'otd');

            if (dateIdx === -1 || lineIdx === -1) throw new Error("Missing required columns for processing.");

            const rawData = [];
            let maxWeek = 0;

            for (let i = headerRowIdx + 1; i < parsed.length; i++) {
                const row = parsed[i];
                if (!row || row.length < headers.length) continue;

                const dateStr = row[dateIdx] || '';
                const weekStr = weekIdx !== -1 ? (row[weekIdx] || '') : '';
                const buildLineStr = row[lineIdx] || '';
                
                let otd = null;
                if (otdIdx !== -1 && row[otdIdx] !== undefined && row[otdIdx].trim() !== '') {
                const parsedOtd = parseFloat(row[otdIdx].replace(/,/g, ''));
                if (!isNaN(parsedOtd)) otd = parsedOtd;
                }

                let is2026 = false;
                if (dateStr.includes('2026')) {
                is2026 = true;
                } else if (dateStr) {
                const d = new Date(dateStr);
                if (!isNaN(d) && d.getFullYear() === 2026) is2026 = true;
                }


                if (!is2026) continue;

                let week = 0;
                if (weekStr) {
                const weekMatch = weekStr.match(/(\d+)/);
                if (weekMatch) week = parseInt(weekMatch[1], 10);
                }
                if (week === 0 && dateStr) {
                const d = new Date(dateStr);
                if (!isNaN(d)) {
                    d.setHours(0, 0, 0, 0);
                    d.setDate(d.getDate() + 3 - (d.getDay() + 6) % 7);
                    const week1 = new Date(d.getFullYear(), 0, 4);
                    week = 1 + Math.round(((d.getTime() - week1.getTime()) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7);
                }
                }

                if (week < 2) continue;

                const lineMatch = buildLineStr.match(/(\d+)/);
                if (!lineMatch) continue;
                const line = parseInt(lineMatch[1], 10);

                if (line >= 1 && line <= 7) {
                // Capture all columns as extra fields for drill-down
                const extras = {};
                headers.forEach((h, idx) => {
                    if (idx !== dateIdx && idx !== weekIdx && idx !== lineIdx && idx !== otdIdx) {
                    const val = (row[idx] || '').trim();
                    if (val) extras[h] = val;
                    }
                });
                rawData.push({ line, week, otd, date: dateStr, extras });
                if (week > maxWeek) maxWeek = week;
                }
            }

            const linesData = {};
            for (let i = 1; i <= 7; i++) {
                linesData[i] = { total: 0, weeks: {} };
                for (let w = 2; w <= Math.max(maxWeek, 7); w++) {
                linesData[i].weeks[w] = 0;
                }
            }

            let trendTotalOverall = 0;
            const trendWeeklyTotals = {};
            let trendOtdSum = 0;
            let trendOtdCount = 0;
            
            const lineOtdStats = {
                1: { sum: 0, count: 0 },
                2: { sum: 0, count: 0 },
                3: { sum: 0, count: 0 },
                4: { sum: 0, count: 0 },
                5: { sum: 0, count: 0 },
                6: { sum: 0, count: 0 },
                7: { sum: 0, count: 0 },
            };

            rawData.forEach(item => {
                if (linesData[item.line].weeks[item.week] !== undefined) {
                linesData[item.line].weeks[item.week]++;
                linesData[item.line].total++;

                if (item.otd !== null) {
                    lineOtdStats[item.line].sum += item.otd;
                    lineOtdStats[item.line].count += 1;
                }

                if (item.line >= 1 && item.line <= 4) {
                    trendTotalOverall++;
                    trendWeeklyTotals[item.week] = (trendWeeklyTotals[item.week] || 0) + 1;
                    if (item.otd !== null) {
                        trendOtdSum += item.otd;
                        trendOtdCount++;
                    }
                }
                }
            });

            let topLine = 1;
            let bestOtdAvg = -Infinity;
            for (let i = 1; i <= 4; i++) {
                if (lineOtdStats[i].count > 0) {
                const avg = lineOtdStats[i].sum / lineOtdStats[i].count;
                if (avg > bestOtdAvg) {
                    bestOtdAvg = avg;
                    topLine = i;
                }
                }
            }
            if (bestOtdAvg === -Infinity) bestOtdAvg = 0; 
            const topLineVal = parseFloat(bestOtdAvg.toFixed(2));

            let highWeek = 2;
            let highWeekVal = -1;
            Object.keys(trendWeeklyTotals).forEach(w => {
                if (trendWeeklyTotals[w] > highWeekVal) {
                highWeekVal = trendWeeklyTotals[w];
                highWeek = parseInt(w, 10);
                }
            });

            const totalChartPoints = [];
            const weeksArrayTotal = Object.keys(trendWeeklyTotals).map(Number).sort((a, b) => a - b);
            let totalSum = 0;
            weeksArrayTotal.forEach(w => {
                totalChartPoints.push({
                weekNum: w,
                weekName: `Week ${w}`,
                production: trendWeeklyTotals[w]
                });
                totalSum += trendWeeklyTotals[w];
            });
            const totalAvg = weeksArrayTotal.length > 0 ? (totalSum / weeksArrayTotal.length).toFixed(1) : 0;
            
            let totalOtdAvg = null;
            if (trendOtdCount > 0) {
                totalOtdAvg = parseFloat((trendOtdSum / trendOtdCount).toFixed(1));
            }

            const totalChart = {
                total: trendTotalOverall,
                avg: parseFloat(totalAvg),
                pastAvg: 16.3, 
                otdAvg: totalOtdAvg,
                data: totalChartPoints
            };

            const lineColors = {
                1: '#0f172a',
                2: '#ea580c',
                3: '#2563eb',
                4: '#16a34a',
                5: '#9333ea',
                6: '#78350f',
                7: '#ca8a04' 
            };

            const pastAvgs = { 1: 4.9, 2: 2.52, 3: 2.76, 4: 6.1 }; 
            const formattedCharts = [];
            for (let i = 1; i <= 7; i++) {
                const chartPoints = [];
                const weeksArray = Object.keys(linesData[i].weeks).map(Number).sort((a, b) => a - b);
                let sum = 0;
                
                weeksArray.forEach((w, idx) => {
                chartPoints.push({ 
                    weekNum: w, 
                    weekName: `Week ${w}`, 
                    production: linesData[i].weeks[w]
                });
                sum += linesData[i].weeks[w];
                });
                
                const avg = weeksArray.length > 0 ? (sum / weeksArray.length).toFixed(1) : 0;
                let otdAvg = null;
                if (lineOtdStats[i].count > 0) {
                otdAvg = parseFloat((lineOtdStats[i].sum / lineOtdStats[i].count).toFixed(1));
                }
                
                formattedCharts.push({
                line: i,
                total: linesData[i].total,
                avg: parseFloat(avg),
                pastAvg: pastAvgs[i] || null, 
                color: lineColors[i], 
                otdAvg: otdAvg, 
                data: chartPoints
                });
            }

            // Build trailer records lookup for drill-down {`${line}_${week}`: [...]}
            const trailerRecords = {};
            rawData.forEach(item => {
                const key = `${item.line}_${item.week}`;
                if (!trailerRecords[key]) trailerRecords[key] = [];
                trailerRecords[key].push({
                    date: item.date,
                    otd: item.otd,
                    ...item.extras
                });
            });

            // Build heatmap matrix data (lines 1-7, all weeks)
            const allWeekNums = [];
            for (let i = 1; i <= 7; i++) {
                Object.keys(linesData[i].weeks).map(Number).forEach(w => {
                    if (!allWeekNums.includes(w)) allWeekNums.push(w);
                });
            }
            allWeekNums.sort((a, b) => a - b);

            const heatmapData = [];
            for (let i = 1; i <= 7; i++) {
                const lineAvg = formattedCharts[i - 1].avg;
                const row = { line: i, lineAvg };
                allWeekNums.forEach(w => {
                    row[`w${w}`] = linesData[i].weeks[w] !== undefined ? linesData[i].weeks[w] : null;
                });
                heatmapData.push(row);
            }

            return {
                totalOverall: trendTotalOverall,
                topLine: { id: topLine, val: topLineVal },
                highWeek: { id: highWeek, val: highWeekVal },
                totalChart,
                charts: formattedCharts,
                heatmapWeeks: allWeekNums,
                heatmapData,
                trailerRecords,
                drilldownHeaders: headers.filter((h, idx) => idx !== weekIdx && idx !== lineIdx),
            };
        }

        function DrilldownModal({ data, onClose }) {
            if (!data) return null;
            const { line, week, records, headers } = data;
            const lineColor = ({ 1: '#0f172a', 2: '#ea580c', 3: '#2563eb', 4: '#16a34a', 5: '#9333ea', 6: '#78350f', 7: '#ca8a04' })[line] || '#64748b';

            // Determine display columns — use drilldownHeaders if provided, else infer from records
            const allKeys = headers && headers.length > 0
                ? headers
                : records.length > 0 ? Object.keys(records[0]) : [];

            // Pretty-print header name
            const fmtHeader = h => h.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());

            // OTD badge colour
            const otdColor = (v) => v === null ? '' : v > 0 ? '#16a34a' : v < 0 ? '#dc2626' : '#64748b';

            return (
                <div
                    className="fixed inset-0 z-50 flex items-center justify-center p-4"
                    style={{ backgroundColor: 'rgba(15,23,42,0.55)', backdropFilter: 'blur(3px)' }}
                    onClick={onClose}
                >
                    <div
                        className="bg-white rounded-2xl shadow-2xl w-full max-w-4xl max-h-[85vh] flex flex-col overflow-hidden"
                        onClick={e => e.stopPropagation()}
                    >
                        {/* Modal header */}
                        <div className="flex items-center justify-between px-6 py-4 border-b border-slate-200" style={{ borderTop: `4px solid ${lineColor}` }}>
                            <div>
                                <h2 className="text-lg font-bold text-slate-900">
                                    Line {line} — Week {week}
                                </h2>
                                <p className="text-sm text-slate-500 mt-0.5">{records.length} trailer{records.length !== 1 ? 's' : ''} completed</p>
                            </div>
                            <button
                                onClick={onClose}
                                className="w-8 h-8 flex items-center justify-center rounded-full text-slate-400 hover:bg-slate-100 hover:text-slate-700 transition-colors text-xl font-light"
                            >✕</button>
                        </div>

                        {/* Table */}
                        <div className="overflow-auto flex-1 px-2">
                            <table className="w-full text-sm">
                                <thead className="sticky top-0 bg-slate-50 z-10">
                                    <tr>
                                        <th className="text-left text-slate-500 font-semibold py-3 px-4 border-b border-slate-200">#</th>
                                        {allKeys.map(k => (
                                            <th key={k} className="text-left text-slate-500 font-semibold py-3 px-4 border-b border-slate-200 whitespace-nowrap">
                                                {fmtHeader(k)}
                                            </th>
                                        ))}
                                    </tr>
                                </thead>
                                <tbody>
                                    {records.map((rec, i) => (
                                        <tr key={i} className={i % 2 === 0 ? 'bg-white' : 'bg-slate-50/60'}>
                                            <td className="py-2.5 px-4 text-slate-400 font-mono text-xs">{i + 1}</td>
                                            {allKeys.map(k => {
                                                const val = rec[k];
                                                if (k === 'otd' || k === 'otd (days)') {
                                                    return (
                                                        <td key={k} className="py-2.5 px-4 whitespace-nowrap">
                                                            {val !== null && val !== undefined && val !== ''
                                                                ? <span className="font-semibold" style={{ color: otdColor(parseFloat(val)) }}>
                                                                    {parseFloat(val) > 0 ? '+' : ''}{val}d
                                                                  </span>
                                                                : <span className="text-slate-300">—</span>
                                                            }
                                                        </td>
                                                    );
                                                }
                                                return (
                                                    <td key={k} className="py-2.5 px-4 text-slate-700 whitespace-nowrap">
                                                        {val !== undefined && val !== '' ? val : <span className="text-slate-300">—</span>}
                                                    </td>
                                                );
                                            })}
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>

                        <div className="px-6 py-3 border-t border-slate-100 text-xs text-slate-400 text-right">
                            Click outside or ✕ to close
                        </div>
                    </div>
                </div>
            );
        }

        function App() {
            // Check for preloaded data inside the HTML file
            const initialData = useMemo(() => {
                const preloadedScript = document.getElementById('preloaded-data');
                if (preloadedScript && preloadedScript.textContent && preloadedScript.textContent !== 'null') {
                    try {
                        return JSON.parse(preloadedScript.textContent);
                    } catch (e) {
                        console.error("Could not parse preloaded data", e);
                        return null;
                    }
                }
                return null;
            }, []);

            const [dashboardData, setDashboardData] = useState(initialData);
            const [excludeLastWeek, setExcludeLastWeek] = useState(false);
            const [drilldown, setDrilldown] = useState(null);
            const [error, setError] = useState(null);
            const [isDragging, setIsDragging] = useState(false);
            const [showPrintHint, setShowPrintHint] = useState(false);
            const [isPreparingPrint, setIsPreparingPrint] = useState(false);

            // Derive display data — optionally strip the most recent week
            const displayData = useMemo(() => {
                if (!dashboardData || !excludeLastWeek) return dashboardData;

                // Find the global max week across all charts
                const allWeeks = dashboardData.totalChart.data.map(d => d.weekNum);
                const maxWeekNum = allWeeks.length > 0 ? Math.max(...allWeeks) : 0;
                if (maxWeekNum === 0) return dashboardData;

                // Filter total chart
                const filteredTotalData = dashboardData.totalChart.data.filter(d => d.weekNum !== maxWeekNum);
                const filteredTotalSum = filteredTotalData.reduce((s, d) => s + d.production, 0);
                const filteredTotalAvg = filteredTotalData.length > 0
                    ? parseFloat((filteredTotalSum / filteredTotalData.length).toFixed(1))
                    : 0;

                // Filter individual line charts
                const filteredCharts = dashboardData.charts.map(chart => {
                    const filteredData = chart.data.filter(d => d.weekNum !== maxWeekNum);
                    const filteredSum = filteredData.reduce((s, d) => s + d.production, 0);
                    const filteredAvg = filteredData.length > 0
                        ? parseFloat((filteredSum / filteredData.length).toFixed(1))
                        : 0;
                    return { ...chart, data: filteredData, total: filteredSum, avg: filteredAvg };
                });

                // Recalculate KPIs from filtered data
                const filteredTotal = filteredTotalData.reduce((s, d) => s + d.production, 0);

                // Recalculate highWeek from filtered total data
                let highWeekId = dashboardData.highWeek.id;
                let highWeekVal = -1;
                filteredTotalData.forEach(d => {
                    if (d.production > highWeekVal) {
                        highWeekVal = d.production;
                        highWeekId = d.weekNum;
                    }
                });

                // Rebuild heatmap from filtered charts
                const filteredHeatmap = dashboardData.heatmapData.map((row, idx) => {
                    const filteredLineAvg = filteredCharts[idx] ? filteredCharts[idx].avg : row.lineAvg;
                    return { ...row, lineAvg: filteredLineAvg };
                });
                // Remove max week column from heatmap
                const filteredHeatmapWeeks = (dashboardData.heatmapWeeks || []).filter(w => w !== maxWeekNum);

                // Filter trailerRecords to exclude max week
                const filteredTrailerRecords = {};
                Object.entries(dashboardData.trailerRecords || {}).forEach(([key, val]) => {
                    const weekPart = parseInt(key.split('_')[1], 10);
                    if (weekPart !== maxWeekNum) filteredTrailerRecords[key] = val;
                });

                return {
                    ...dashboardData,
                    totalOverall: filteredTotal,
                    highWeek: { id: highWeekId, val: highWeekVal >= 0 ? highWeekVal : dashboardData.highWeek.val },
                    totalChart: {
                        ...dashboardData.totalChart,
                        total: filteredTotal,
                        avg: filteredTotalAvg,
                        data: filteredTotalData,
                    },
                    charts: filteredCharts,
                    heatmapData: filteredHeatmap,
                    heatmapWeeks: filteredHeatmapWeeks,
                    trailerRecords: filteredTrailerRecords,
                };
            }, [dashboardData, excludeLastWeek]);

            const handleBarClick = (line, weekNum) => {
                const key = `${line}_${weekNum}`;
                const records = (displayData.trailerRecords || {})[key] || [];
                setDrilldown({ line, week: weekNum, records, headers: displayData.drilldownHeaders || [] });
            };
            
            const handleExportWithData = () => {
                const clone = document.documentElement.cloneNode(true);
                const preloadedEl = clone.querySelector('#preloaded-data');
                if (preloadedEl) {
                    preloadedEl.textContent = JSON.stringify(dashboardData);
                }

                const rootEl = clone.querySelector('#root');
                if (rootEl) {
                    rootEl.innerHTML = '';
                }

                const newHtml = "<!DOCTYPE html>\n<html lang=\"en\">\n" + clone.outerHTML + "\n</html>";
                const blob = new Blob([newHtml], { type: 'text/html' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                
                const safeDate = new Date().toISOString().split('T')[0];
                a.download = `Fontaine_Dashboard_Export_${safeDate}.html`;
                
                a.click();
                URL.revokeObjectURL(url);
            };

            const handlePrint = () => {
                setIsPreparingPrint(true);
                
                setTimeout(() => {
                try {
                    const printRoot = document.getElementById('printable-root');
                    if (!printRoot) return;

                    const styles = Array.from(document.querySelectorAll('style, link[rel="stylesheet"]'))
                    .map(el => el.outerHTML)
                    .join('\n');

                    const content = printRoot.innerHTML;
                    const printWindow = window.open('', '_blank');
                    
                    if (printWindow) {
                    printWindow.document.open();
                    printWindow.document.write(`
                        <!DOCTYPE html>
                        <html>
                        <head>
                            <title>Production Dashboard - Print</title>
                            ${styles}
                            <script src="https://unpkg.com/@phosphor-icons/web"><\/script>
                            <style>
                            #printable-root { width: auto !important; height: auto !important; max-width: none !important; }
                            .print-hidden { display: none !important; }
                            
                            @media print {
                                @page { size: landscape; margin: 10mm; }
                                body { background: white !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; margin: 0; padding: 0; }
                                
                                .print-grid-override { display: block !important; width: 100% !important; margin: 0 !important; padding: 0 !important; }
                                
                                .print-page { 
                                width: 100% !important;
                                height: 95vh !important; 
                                page-break-before: always !important; 
                                break-before: page !important;
                                page-break-after: always !important; 
                                break-after: page !important; 
                                page-break-inside: avoid !important;
                                break-inside: avoid !important;
                                padding: 10mm !important;
                                margin: 0 !important;
                                box-sizing: border-box !important;
                                }
                                
                                .max-w-7xl > .print-page:first-child {
                                page-break-before: auto !important;
                                break-before: auto !important;
                                }
                                
                                .print-page:last-child {
                                page-break-after: auto !important;
                                break-after: auto !important;
                                }
                            }
                            </style>
                        </head>
                        <body>
                            ${content}
                            <script>
                            setTimeout(() => {
                                window.print();
                            }, 500);
                            <\/script>
                        </body>
                        </html>
                    `);
                    printWindow.document.close();
                    } else {
                    setShowPrintHint(true);
                    setTimeout(() => setShowPrintHint(false), 8000);
                    }
                } catch (err) {
                    console.error("Print generation failed:", err);
                    setShowPrintHint(true);
                    setTimeout(() => setShowPrintHint(false), 8000);
                } finally {
                    setIsPreparingPrint(false);
                }
                }, 600);
            };

            const handleFile = (file) => {
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (evt) => {
                    const buffer = evt.target.result;
                    
                    if (!buffer || buffer.byteLength === 0) {
                        setError("File is empty or could not be read.");
                        return;
                    }
                    
                    try {
                        const headerLength = Math.min(buffer.byteLength, 8);
                        const magicBytes = new Uint8Array(buffer, 0, headerLength);
                        
                        const isZip = magicBytes.length > 3 && magicBytes[0] === 0x50 && magicBytes[1] === 0x4B && magicBytes[2] === 0x03 && magicBytes[3] === 0x04;
                        const isCFB = magicBytes.length > 7 && magicBytes[0] === 0xD0 && magicBytes[1] === 0xCF && magicBytes[2] === 0x11 && magicBytes[3] === 0xE0;

                        if (isZip || isCFB) {
                            // Valid binary Excel file
                            try {
                                const data = new Uint8Array(buffer);
                                // Utilizing native Uint8Array avoids string manipulation memory leaks entirely
                                const workbook = XLSX.read(data, { 
                                    type: 'array', 
                                    dense: true,
                                    cellDates: true,
                                    cellFormula: false,
                                    cellHTML: false,
                                    cellStyles: false 
                                });
                                const sheet = workbook.Sheets[workbook.SheetNames[0]];
                                const csvText = XLSX.utils.sheet_to_csv(sheet);
                                const result = processData(csvText);
                                setDashboardData(result);
                                setError(null);
                            } catch (err) {
                                console.error("SheetJS error:", err);
                                setError("Failed to parse the Excel file. It may be too large to process in the browser. Please save the file as a .csv and upload again.");
                            }
                        } else {
                            // Text-based file (CSV, TSV, or HTML fake-xls)
                            let isUTF16 = false;
                            if (magicBytes.length > 3) {
                                if (magicBytes[0] === 0xFF && magicBytes[1] === 0xFE) isUTF16 = true; 
                                else if (magicBytes[0] === 0xFE && magicBytes[1] === 0xFF) isUTF16 = true; 
                                else if (magicBytes[1] === 0x00 && magicBytes[3] === 0x00) isUTF16 = true; 
                            }

                            let text = new TextDecoder(isUTF16 ? 'utf-16le' : 'utf-8').decode(buffer);

                            const lowerStart = text.substring(0, 500).toLowerCase().trim();
                            if (lowerStart.startsWith('<html') || lowerStart.startsWith('<table') || lowerStart.startsWith('<meta')) {
                                text = text.replace(/<\/tr>/gi, '\n');
                                text = text.replace(/<\/td>|<\/th>/gi, ',');
                                text = text.replace(/<[^>]+>/g, '');
                                text = text.replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&');
                            }

                            const firstLine = text.substring(0, 1000);
                            if (firstLine.includes('\t') && !firstLine.includes(',')) {
                                text = text.replace(/\t/g, ',');
                            }

                            const result = processData(text);
                            setDashboardData(result);
                            setError(null);
                        }
                    } catch (err) {
                        console.error("Processing error:", err);
                        setError(err.message || "Failed to process the file. Please ensure it is a valid CSV or Excel file.");
                    }
                };
                reader.readAsArrayBuffer(file);

                                })}
                            </div>
                        </div>


                    </div>


                    {/* HEATMAP SECTION */}
                    <div className="bg-white p-6 md:p-8 rounded-xl shadow-sm border border-slate-200/60 mb-8 print:mb-0">
                        <div className="border-b border-slate-200 pb-4 print:border-none print:pb-2 mb-5">
                            <h1 className="text-2xl print:text-xl font-bold text-slate-900 tracking-tight print-show hidden">Production Dashboard</h1>
                            <h3 className="text-lg font-bold text-slate-900">Weekly Output Heatmap</h3>
                            <p className="text-sm text-slate-500 mt-0.5">
                                Output per line per week — green above avg, red below avg
                                <span className="print-show hidden ml-2 text-slate-400">(Rolling 12 weeks shown)</span>
                            </p>
                        </div>
                        {displayData.heatmapWeeks && displayData.heatmapData && (() => {
                            // Screen: all weeks. Print: rolling last 12 only.
                            const allWeeks = displayData.heatmapWeeks;
                            const printWeeks = allWeeks.slice(-12);

                            const HeatmapTable = ({ weeks, compact }) => (
                                <table className="w-full text-sm border-collapse" style={{ minWidth: `${Math.max(300, weeks.length * (compact ? 44 : 52) + 80)}px` }}>
                                    <thead>
                                        <tr>
                                            <th className="text-left text-slate-500 font-semibold py-2 pr-3 w-16">Line</th>
                                            {weeks.map(w => (
                                                <th key={w} className="text-center text-slate-400 font-medium py-2 px-1" style={{ minWidth: compact ? 40 : 44 }}>W{w}</th>
                                            ))}
                                            <th className="text-center text-slate-500 font-semibold py-2 px-2 w-16">Avg</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {displayData.heatmapData.map(row => {
                                            const lineColor = ({ 1: '#0f172a', 2: '#ea580c', 3: '#2563eb', 4: '#16a34a', 5: '#9333ea', 6: '#78350f', 7: '#ca8a04' })[row.line];
                                            return (
                                                <tr key={row.line}>
                                                    <td className="py-1 pr-3 font-bold text-sm" style={{ color: lineColor }}>Line {row.line}</td>
                                                    {weeks.map(w => {
                                                        const val = row[`w${w}`];
                                                        if (val === null || val === undefined) {
                                                            return <td key={w} className="py-1 px-1 text-center"><div className="rounded w-10 h-8 mx-auto bg-slate-100" /></td>;
                                                        }
                                                        const ratio = row.lineAvg > 0 ? val / row.lineAvg : 0;
                                                        let bg, fg;
                                                        if (val === 0)          { bg = '#fef2f2'; fg = '#dc2626'; }
                                                        else if (ratio < 0.6)  { bg = '#fee2e2'; fg = '#b91c1c'; }
                                                        else if (ratio < 0.85) { bg = '#fef3c7'; fg = '#92400e'; }
                                                        else if (ratio < 1.15) { bg = '#f0fdf4'; fg = '#166534'; }
                                                        else if (ratio < 1.4)  { bg = '#dcfce7'; fg = '#15803d'; }
                                                        else                   { bg = '#bbf7d0'; fg = '#14532d'; }
                                                        return (
                                                            <td key={w} className="py-1 px-1 text-center">
                                                                <div className="rounded mx-auto flex items-center justify-center font-bold text-xs"
                                                                    style={{ backgroundColor: bg, color: fg, width: compact ? 36 : 40, height: compact ? 30 : 32 }}>
                                                                    {val}
                                                                </div>
                                                            </td>
                                                        );
                                                    })}
                                                    <td className="py-1 px-2 text-center">
                                                        <div className="rounded w-12 h-8 mx-auto flex items-center justify-center font-bold text-xs bg-slate-100 text-slate-600">
                                                            {row.lineAvg}
                                                        </div>
                                                    </td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            );

                            const Legend = () => (
                                <div className="flex items-center gap-4 mt-4 text-xs text-slate-500 flex-wrap">
                                    <span className="font-semibold">Legend:</span>
                                    {[['#fef2f2','#dc2626','Zero'], ['#fee2e2','#b91c1c','< 60% avg'], ['#fef3c7','#92400e','60–85%'], ['#f0fdf4','#166534','85–115%'], ['#dcfce7','#15803d','115–140%'], ['#bbf7d0','#14532d','> 140%']].map(([bg, fg, label]) => (
                                        <div key={label} className="flex items-center gap-1.5">
                                            <div className="w-6 h-5 rounded flex items-center justify-center font-bold" style={{ backgroundColor: bg, color: fg }}>■</div>
                                            <span>{label}</span>
                                        </div>
                                    ))}
                                </div>
                            );

                            return (
                                <>
                                    {/* SCREEN: all weeks with horizontal scroll */}
                                    <div className="overflow-x-auto print-hidden">
                                        <HeatmapTable weeks={allWeeks} compact={false} />
                                        <Legend />
                                    </div>
                                    {/* PRINT: rolling last 12 weeks, no scroll needed */}
                                    <div className="hidden print-show" style={{ overflowX: 'visible' }}>
                                        <HeatmapTable weeks={printWeeks} compact={true} />
                                        <Legend />
                                    </div>
                                </>
                            );
                        })()}
                    </div>

                                        {/* INDIVIDUAL LINE PAGES (Lines 1-7) */}
                    <div className="print-grid-override grid grid-cols-1 lg:grid-cols-2 gap-8">
                        {displayData.charts.map((chart) => (
                        <div key={chart.line} className="print-page bg-white p-6 md:p-8 rounded-xl shadow-sm border border-slate-200/60 mb-8 print:mb-0">
                            
                            <div className="print-chart-wrapper flex flex-col flex-1">
                            <div className="flex justify-between items-start mb-4">
                                <div>
                                <h3 className="text-xl font-bold text-slate-900">Production Report - Line {chart.line}</h3>
                                <p className="text-sm text-slate-500 mt-1">
                                    2026 Calendar Year (Week 2 onwards) Total Produced: <span className="font-semibold text-slate-700">{chart.total}</span>
                                </p>
                                </div>
                                <div className="text-right flex flex-col sm:flex-row gap-2 items-end sm:items-center">
                                {chart.otdAvg !== null && (
                                    <div className="flex items-center gap-2 px-3 py-1 bg-sky-50 text-sky-700 rounded font-semibold text-sm border border-sky-100 print:bg-[#f0f9ff] print:text-[#0369a1] print:border-[#e0f2fe]">
                                    Avg OTD: {chart.otdAvg > 0 ? '+' : ''}{chart.otdAvg} days
                                    </div>
                                )}
                                <div className="flex items-center gap-2 px-3 py-1 bg-red-50 text-red-700 rounded font-semibold text-sm border border-red-100 print:bg-[#fef2f2] print:text-[#b91c1c] print:border-[#fee2e2]">
                                    <span className="w-4 border-t-2 border-dashed border-red-500 print:border-[#ef4444]"></span>
                                    '26 Avg: {chart.avg}
                                </div>
                                {chart.pastAvg !== null && (
                                    <div className="flex items-center gap-2 px-3 py-1 bg-slate-50 text-slate-600 rounded font-semibold text-sm border border-slate-200 print:bg-[#f8fafc] print:text-[#475569] print:border-[#e2e8f0]">
                                    <span className="w-4 border-t-2 border-dashed border-slate-500 print:border-[#64748b]"></span>
                                    '25 Avg: {chart.pastAvg}
                                    </div>
                                )}
                                </div>
                            </div>

                            <div className="print-chart-container w-full h-[320px]">
                                <ResponsiveContainer width="100%" height="100%">
                                <BarChart data={chart.data} margin={{ top: 20, right: 10, left: -20, bottom: 0 }} style={{ cursor: 'pointer' }} onClick={(e) => { if (e && e.activePayload && e.activePayload[0]) { const pt = e.activePayload[0].payload; handleBarClick(chart.line, pt.weekNum); } }}>
                                    <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#e2e8f0" />
                                    <XAxis 
                                    dataKey="weekName" 
                                    axisLine={false} 
                                    tickLine={false} 
                                    tick={{ fill: '#64748b', fontSize: 13 }} 
                                    dy={10}
                                    />
                                    <YAxis 
                                    axisLine={false} 
                                    tickLine={false} 
                                    tick={{ fill: '#64748b', fontSize: 13 }} 
                                    label={{ value: 'Trailers Produced', angle: -90, position: 'insideLeft', offset: 25, fill: '#64748b', fontSize: 13 }}
                                    domain={[0, { 1: 10, 2: 7, 3: 6, 4: 13, 6: 6, 7: 6 }[chart.line] || 'auto']}
                                    />
                                    <Tooltip content={<CustomTooltip />} cursor={{ fill: '#f1f5f9' }} />
                                    <ReferenceLine 
                                    y={chart.avg} 
                                    stroke="#ef4444" 
                                    strokeDasharray="4 4" 
                                    />
                                    {chart.pastAvg !== null && (
                                    <ReferenceLine 
                                        y={chart.pastAvg} 
                                        stroke="#64748b" 
                                        strokeDasharray="4 4" 
                                    />
                                    )}
                                    <Bar dataKey="production" fill={chart.color} radius={[4, 4, 0, 0]} maxBarSize={60} isAnimationActive={!isPreparingPrint}>
                                    <LabelList 
                                        dataKey="production" 
                                        position="top" 
                                        formatter={formatZeroLabel} 
                                        style={{ fill: '#475569', fontSize: 13, fontWeight: 600 }} 
                                    />
                                    </Bar>

                                </BarChart>
                                </ResponsiveContainer>
                            </div>
                            </div>

                        </div>
                        ))}
                    </div>

                    </div>
                </div>
                {drilldown && <DrilldownModal data={drilldown} onClose={() => setDrilldown(null)} />}
                </React.Fragment>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
